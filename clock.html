<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <link rel="stylesheet" type="text/css" href="styles.css"> <!-- Link to CSS -->
</head>
<body>
    <div id="clock">
        <h2>The time is now</h2>
        <div id="time">
            <div><span id="hour">00</span><span>Hrs</span></div>
            <div><span id="minutes">00</span><span>Min</span></div>
            <div><span id="seconds">00</span><span>Sec</span></div>
            <div><span id="ampm"></span></div>
        </div>
    </div>
    <script src="script.js"></script> <!-- Link to JavaScript -->
</body>
</html>
